name: Build Zaycho Shop APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build APK
      run: |
        # ဇစ်ဖိုင်ပါလာပါက အလိုအလျောက် ဖြည်ပေးရန်
        for z in *.zip; do
          if [ -f "$z" ]; then
            unzip -o "$z"
          fi
        done
        
        # Project တည်နေရာရှာပြီး Gradle ဖြင့် APK တည်ဆောက်ရန်
        SETTINGS_FILE=$(find . -name "settings.gradle.kts" | head -n 1)
        if [ -n "$SETTINGS_FILE" ]; then
          cd "$(dirname "$SETTINGS_FILE")"
          gradle assembleDebug
        else
          echo "Settings file not found!"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Zaycho-Shop-APK
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
